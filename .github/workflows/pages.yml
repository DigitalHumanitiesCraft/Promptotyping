name: Deploy Pages

# Publishes the paths listed below and nothing else. The agent instructions in
# CLAUDE.md and the repository's own README and CHANGELOG stay in the repository.
# knowledge/ is published by an explicit decision of 2026-11-14 recorded in
# knowledge/specification.md: this project is the worked example of the site.
# A new top-level folder the site needs must be added to the list below.
# Requires the Pages source "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the published tree
        run: |
          mkdir _site
          git ls-files -z -- index.html 404.html LICENSE CITATION.cff assets templates knowledge case-studies \
            | xargs -0 cp --parents -t _site
      - name: Build the template archive
        run: |
          mkdir _site/downloads
          zip -j _site/downloads/promptotyping-templates.zip templates/*.md LICENSE
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

name: Deploy Pages

# Publishes the folders the portal serves and nothing else. The knowledge base,
# the action layer, tools and tests stay in the repository.
# A new top-level folder the site loads must be added to the list below.
# Requires the Pages source "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the published tree
        run: |
          mkdir _site
          git ls-files -z -- index.html 404.html LICENSE CITATION.cff assets _content schema \
            | xargs -0 cp --parents -t _site
      - name: Build the download archive
        run: python3 tools/build_downloads.py _site/downloads
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

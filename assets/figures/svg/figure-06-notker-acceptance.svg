<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="t d">
  <title id="t">Purpose-specific acceptance in the Notker edition case</title>
  <desc id="d">Promptotyping Documents holding the Psalm 2 sample, editorial guidelines, TEI source model and layer definitions were turned into an Edition Interface with five textual layers. The resulting state was accepted as a proposal-stage demonstrator and does not imply a completed or publication-ready edition, while corpus-wide philological verification remains open.</desc>
  <defs>
    <marker id="flowhead" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0.6 L9.6,5 L0,9.4 Z" fill="#111111"/>
    </marker>
    <marker id="supporthead" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0.6,1.2 L9.2,5 L0.6,8.8 Z" fill="#ffffff" stroke="#666666" stroke-width="1.2"/>
    </marker>
    <style>
      text { font-family: Inter, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #111111; }
      .n { font-size: 16px; font-weight: 600; }
      .s { font-size: 13px; }
      .m { font-size: 13px; font-weight: 600; }
      .e { font-size: 11px; fill: #666666; }
      .box { fill: #ffffff; stroke: #111111; stroke-width: 1.5; }
      .panel { fill: #f2f2f2; stroke: #111111; stroke-width: 1.5; }
      .flow { fill: none; stroke: #111111; stroke-width: 1.5; stroke-linejoin: round; marker-end: url(#flowhead); }
      .support { fill: none; stroke: #666666; stroke-width: 1.5; stroke-linejoin: round; stroke-dasharray: 6 4; marker-end: url(#supporthead); }
      .plain { fill: none; stroke: #111111; stroke-width: 1.5; stroke-linejoin: round; }
      .rule { stroke: #d9d9d9; stroke-width: 1.5; }
      .disc { fill: #111111; }
    </style>
  </defs>

  <rect x="0" y="0" width="960" height="480" fill="#ffffff"/>

  <!-- Declarative basis -->
  <rect class="panel" x="30" y="64" width="230" height="306" rx="2"/>
  <text class="n" x="145" y="96" text-anchor="middle">Promptotyping</text>
  <text class="n" x="145" y="116" text-anchor="middle">Documents</text>
  <text class="s" x="145" y="136" text-anchor="middle">declarative basis</text>
  <rect class="box" x="48" y="152" width="194" height="42" rx="2"/>
  <text class="s" x="145" y="178" text-anchor="middle">Psalm 2 sample</text>
  <rect class="box" x="48" y="204" width="194" height="42" rx="2"/>
  <text class="s" x="145" y="230" text-anchor="middle">editorial guidelines</text>
  <rect class="box" x="48" y="256" width="194" height="42" rx="2"/>
  <text class="s" x="145" y="282" text-anchor="middle">TEI source model</text>
  <rect class="box" x="48" y="308" width="194" height="42" rx="2"/>
  <text class="s" x="145" y="334" text-anchor="middle">layer definitions</text>

  <path class="flow" d="M264,250 H346"/>
  <text class="e" x="305" y="226" text-anchor="middle">generated</text>
  <text class="e" x="305" y="240" text-anchor="middle">implementation</text>

  <!-- Edition Interface -->
  <rect class="panel" x="350" y="64" width="230" height="306" rx="2"/>
  <text class="n" x="465" y="96" text-anchor="middle">Edition Interface</text>
  <text class="s" x="465" y="116" text-anchor="middle">textual layers made</text>
  <text class="s" x="465" y="134" text-anchor="middle">operational</text>
  <rect class="box" x="368" y="150" width="194" height="200" rx="2"/>
  <path class="rule" d="M368,190 H562"/>
  <path class="rule" d="M368,230 H562"/>
  <path class="rule" d="M368,270 H562"/>
  <path class="rule" d="M368,310 H562"/>
  <text class="s" x="384" y="176">Latin psalm</text>
  <text class="s" x="384" y="216">Old High German</text>
  <text class="s" x="384" y="256">commentary</text>
  <text class="s" x="384" y="296">translation</text>
  <text class="s" x="384" y="336">apparatus</text>

  <path class="flow" d="M584,250 H666"/>
  <text class="e" x="625" y="212" text-anchor="middle">acceptance</text>
  <text class="e" x="625" y="226" text-anchor="middle">for a stated</text>
  <text class="e" x="625" y="240" text-anchor="middle">purpose</text>

  <!-- Acceptance -->
  <rect class="box" x="670" y="64" width="260" height="306" rx="2"/>
  <circle cx="694" cy="96" r="11" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
  <circle cx="694" cy="96" r="5" class="disc"/>
  <text class="n" x="716" y="102">Acceptance</text>
  <text class="s" x="694" y="142">Accepted for a stated purpose</text>
  <text class="m" x="694" y="166">proposal-stage demonstrator</text>
  <path class="rule" d="M694,206 H906"/>
  <text class="m" x="694" y="240">Does not imply</text>
  <text class="s" x="694" y="266">a completed or publication-ready</text>
  <text class="s" x="694" y="284">edition</text>
  <text class="s" x="694" y="316">corpus-wide philological</text>
  <text class="s" x="694" y="334">verification remains open</text>

  <!-- Legend -->
  <path class="flow" d="M30,414 H68"/>
  <text class="e" x="80" y="418">operational flow</text>
  <circle cx="44" cy="442" r="9" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
  <circle cx="44" cy="442" r="4" class="disc"/>
  <text class="e" x="80" y="446">accountable human authority</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="t d">
  <title id="t">Purpose-specific acceptance in the Notker edition case</title>
  <desc id="d">Three cards of equal width. Knowledge Documents holding the Psalm 2 sample, editorial guidelines, TEI source model and layer definitions were turned into an Edition Interface with five textual layers. The resulting state was accepted as a proposal-stage demonstrator and does not imply a completed or publication-ready edition, while corpus-wide philological validation remains open.</desc>
  <defs>
    <marker id="flowhead" viewBox="0 0 12 12" refX="11.5" refY="6" markerWidth="12" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0.5,0.8 L11.5,6 L0.5,11.2 Z" fill="#111111"/>
    </marker>
    <marker id="supporthead" viewBox="0 0 12 12" refX="11.5" refY="6" markerWidth="12" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1.2,1.8 L11.0,6 L1.2,10.2 Z" fill="#ffffff" stroke="#666666" stroke-width="1.2"/>
    </marker>
    <style>
      text { font-family: Inter, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #111111; }
      .n { font-size: 17px; font-weight: 600; }
      .s { font-size: 13px; }
      .m { font-size: 13px; font-weight: 600; }
      .e { font-size: 12px; fill: #666666; }
      .box { fill: #ffffff; stroke: #111111; stroke-width: 2.5; }
      .sub { fill: #ffffff; stroke: #111111; stroke-width: 1.25; }
      .mark { fill: #eeeeee; stroke: #111111; stroke-width: 2.5; }
      .flow { fill: none; stroke: #111111; stroke-width: 2.5; stroke-linejoin: round; marker-end: url(#flowhead); }
      .rule { fill: none; stroke: #111111; stroke-width: 1.25; }
      .row { fill: none; stroke: #d9d9d9; stroke-width: 1.25; }
      .disc { fill: #111111; }
    </style>
  </defs>

  <rect x="0" y="0" width="960" height="480" fill="#ffffff"/>

  <!-- Declarative basis -->
  <rect class="box" x="20" y="40" width="246" height="352" rx="2"/>
  <text class="n" x="143" y="76" text-anchor="middle">Knowledge</text>
  <text class="n" x="143" y="98" text-anchor="middle">Documents</text>
  <text class="s" x="143" y="120" text-anchor="middle">declarative basis</text>
  <rect class="sub" x="38" y="140" width="210" height="50" rx="2"/>
  <text class="s" x="143" y="170" text-anchor="middle">Psalm 2 sample</text>
  <rect class="sub" x="38" y="200" width="210" height="50" rx="2"/>
  <text class="s" x="143" y="230" text-anchor="middle">editorial guidelines</text>
  <rect class="sub" x="38" y="260" width="210" height="50" rx="2"/>
  <text class="s" x="143" y="290" text-anchor="middle">TEI source model</text>
  <rect class="sub" x="38" y="320" width="210" height="50" rx="2"/>
  <text class="s" x="143" y="350" text-anchor="middle">layer definitions</text>

  <path class="flow" d="M268,216 H355"/>
  <text class="e" x="311" y="190" text-anchor="middle">generated</text>
  <text class="e" x="311" y="206" text-anchor="middle">implementation</text>

  <!-- Edition Interface -->
  <rect class="box" x="357" y="40" width="246" height="352" rx="2"/>
  <text class="n" x="480" y="76" text-anchor="middle">Edition Interface</text>
  <text class="s" x="480" y="98" text-anchor="middle">textual layers made</text>
  <text class="s" x="480" y="116" text-anchor="middle">operational</text>
  <rect class="sub" x="375" y="140" width="210" height="230" rx="2"/>
  <path class="row" d="M375,186 H585"/>
  <path class="row" d="M375,232 H585"/>
  <path class="row" d="M375,278 H585"/>
  <path class="row" d="M375,324 H585"/>
  <text class="s" x="391" y="168">Latin psalm</text>
  <text class="s" x="391" y="214">Old High German</text>
  <text class="s" x="391" y="260">commentary</text>
  <text class="s" x="391" y="306">translation</text>
  <text class="s" x="391" y="352">apparatus</text>

  <path class="flow" d="M605,216 H692"/>
  <text class="e" x="648" y="174" text-anchor="middle">acceptance</text>
  <text class="e" x="648" y="190" text-anchor="middle">for a stated</text>
  <text class="e" x="648" y="206" text-anchor="middle">purpose</text>

  <!-- Acceptance, the emphasised element -->
  <rect class="mark" x="694" y="40" width="246" height="352" rx="2"/>
  <text class="n" x="817" y="78" text-anchor="middle">Acceptance</text>
  <circle cx="817" cy="114" r="13" fill="#ffffff" stroke="#111111" stroke-width="2.5"/>
  <circle cx="817" cy="114" r="6" class="disc"/>
  <text class="m" x="817" y="160" text-anchor="middle">Accepted for a stated purpose</text>
  <text class="s" x="817" y="182" text-anchor="middle">proposal-stage demonstrator</text>
  <path class="rule" d="M712,206 H922"/>
  <text class="m" x="817" y="254" text-anchor="middle">Does not imply</text>
  <text class="s" x="817" y="278" text-anchor="middle">a completed or</text>
  <text class="s" x="817" y="296" text-anchor="middle">publication-ready edition</text>
  <text class="s" x="817" y="328" text-anchor="middle">corpus-wide philological</text>
  <text class="s" x="817" y="346" text-anchor="middle">validation remains open</text>

  <!-- Legend -->
  <path class="flow" d="M20,424 H66"/>
  <text class="e" x="78" y="428">operational flow</text>
  <circle cx="34" cy="452" r="10" fill="#ffffff" stroke="#111111" stroke-width="2.5"/>
  <circle cx="34" cy="452" r="4.5" class="disc"/>
  <text class="e" x="78" y="456">accountable human authority</text>
</svg>

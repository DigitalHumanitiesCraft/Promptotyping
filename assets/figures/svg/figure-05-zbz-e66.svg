<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" role="img" aria-labelledby="t d">
  <title id="t">The ZBZ OCR/TEI workflow before and after decision E66</title>
  <desc id="d">Two columns of equal width divided by decision E66, both beginning with the same generated output. Before E66, generated output passed through agent screening into an agent-recorded approval status that no responsible person had authorised. After E66, generated output feeds a per-stream workflow state as well as deterministic validation and agentic review, which converge in an evidence box; evidence informs Critical Expert verification, which alone authorises the human-authorised verification status.</desc>
  <defs>
    <marker id="flowhead" viewBox="0 0 12 12" refX="11.5" refY="6" markerWidth="12" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0.5,0.8 L11.5,6 L0.5,11.2 Z" fill="#111111"/>
    </marker>
    <marker id="supporthead" viewBox="0 0 12 12" refX="11.5" refY="6" markerWidth="12" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1.2,1.8 L11.0,6 L1.2,10.2 Z" fill="#ffffff" stroke="#666666" stroke-width="1.2"/>
    </marker>
    <style>
      text { font-family: Inter, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #111111; }
      .h { font-size: 18px; font-weight: 600; }
      .n { font-size: 17px; font-weight: 600; }
      .s { font-size: 13px; }
      .m { font-size: 13px; font-weight: 600; }
      .e { font-size: 12px; fill: #666666; }
      .box { fill: #ffffff; stroke: #111111; stroke-width: 2.5; }
      .sub { fill: #ffffff; stroke: #111111; stroke-width: 1.25; }
      .mark { fill: #eeeeee; stroke: #111111; stroke-width: 2.5; }
      .flow { fill: none; stroke: #111111; stroke-width: 2.5; stroke-linejoin: round; marker-end: url(#flowhead); }
      .plain { fill: none; stroke: #111111; stroke-width: 2.5; stroke-linejoin: round; }
      .support { fill: none; stroke: #666666; stroke-width: 1.25; stroke-linejoin: round; stroke-dasharray: 6 4; marker-end: url(#supporthead); }
      .divider { fill: none; stroke: #666666; stroke-width: 1.25; }
      .disc { fill: #111111; }
    </style>
  </defs>

  <rect x="0" y="0" width="960" height="700" fill="#ffffff"/>

  <!-- Column heads -->
  <text class="h" x="240" y="40" text-anchor="middle">Before E66</text>
  <text class="h" x="720" y="40" text-anchor="middle">After E66</text>

  <!-- Divider -->
  <path class="divider" d="M480,54 V616"/>
  <rect x="412" y="318" width="136" height="32" fill="#ffffff"/>
  <text class="n" x="480" y="340" text-anchor="middle">Decision E66</text>

  <!-- Left column -->
  <rect class="box" x="90" y="68" width="300" height="60" rx="2"/>
  <text class="n" x="240" y="104" text-anchor="middle">Generated output</text>
  <path class="flow" d="M240,128 V164"/>

  <rect class="box" x="90" y="168" width="300" height="60" rx="2"/>
  <text class="n" x="240" y="204" text-anchor="middle">Agent screening</text>
  <path class="flow" d="M240,228 V264"/>

  <rect class="box" x="90" y="268" width="300" height="80" rx="2"/>
  <text class="n" x="240" y="302" text-anchor="middle">Agent-recorded</text>
  <text class="n" x="240" y="324" text-anchor="middle">approval status</text>

  <rect class="sub" x="90" y="492" width="300" height="114" rx="2"/>
  <text class="s" x="110" y="522">production and verification</text>
  <text class="s" x="110" y="544">collapse into one operation;</text>
  <text class="s" x="110" y="566">no responsible person</text>
  <text class="s" x="110" y="588">authorised the status</text>

  <!-- Right column -->
  <rect class="box" x="500" y="68" width="200" height="60" rx="2"/>
  <text class="n" x="600" y="104" text-anchor="middle">Generated output</text>

  <rect class="box" x="740" y="68" width="200" height="60" rx="2"/>
  <text class="n" x="840" y="98" text-anchor="middle">Workflow state</text>
  <text class="s" x="840" y="118" text-anchor="middle">per stream</text>
  <path class="flow" d="M700,98 H740"/>

  <path class="plain" d="M600,128 V150"/>
  <path class="plain" d="M600,150 H840"/>
  <path class="flow" d="M600,150 V174"/>
  <path class="flow" d="M840,150 V174"/>

  <rect class="box" x="500" y="178" width="200" height="72" rx="2"/>
  <text class="n" x="600" y="210" text-anchor="middle">Deterministic</text>
  <text class="n" x="600" y="232" text-anchor="middle">validation</text>

  <rect class="box" x="740" y="178" width="200" height="72" rx="2"/>
  <text class="n" x="840" y="220" text-anchor="middle">Agentic review</text>

  <path class="flow" d="M600,250 V272 H660 V288"/>
  <path class="flow" d="M840,250 V272 H780 V288"/>

  <rect class="box" x="570" y="292" width="300" height="86" rx="2"/>
  <text class="n" x="720" y="324" text-anchor="middle">Evidence</text>
  <text class="s" x="720" y="350" text-anchor="middle">reports about the output</text>
  <text class="s" x="720" y="368" text-anchor="middle">never an authorisation</text>

  <path class="support" d="M720,378 V406"/>
  <text class="e" x="732" y="396">informs</text>

  <!-- Critical Expert verification, the emphasised element -->
  <rect class="mark" x="570" y="410" width="300" height="78" rx="2"/>
  <circle cx="606" cy="449" r="13" fill="#ffffff" stroke="#111111" stroke-width="2.5"/>
  <circle cx="606" cy="449" r="6" class="disc"/>
  <text class="n" x="634" y="443">Critical Expert</text>
  <text class="n" x="634" y="465">verification</text>

  <path class="flow" d="M720,488 V516"/>
  <text class="e" x="732" y="506">authorises</text>

  <rect class="box" x="570" y="520" width="300" height="86" rx="2"/>
  <text class="n" x="720" y="552" text-anchor="middle">Human-authorised</text>
  <text class="n" x="720" y="574" text-anchor="middle">verification status</text>
  <text class="s" x="720" y="596" text-anchor="middle">only accountable editors</text>

  <!-- Legend -->
  <path class="flow" d="M20,628 H66"/>
  <text class="e" x="78" y="632">operational flow</text>
  <path class="support" d="M20,652 H66"/>
  <text class="e" x="78" y="656">evidence relation</text>
  <circle cx="34" cy="676" r="10" fill="#ffffff" stroke="#111111" stroke-width="2.5"/>
  <circle cx="34" cy="676" r="4.5" class="disc"/>
  <text class="e" x="78" y="680">accountable human authority</text>
</svg>

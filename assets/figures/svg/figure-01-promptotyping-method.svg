<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="t d">
  <title id="t">The Promptotyping method</title>
  <desc id="d">Preparation, Exploration, Distillation and Implementation stand in one row as recurrent forms of work and lead into the promptotype. Three dashed returns lead from Implementation back to Distillation, Exploration and Preparation. The Critical Expert specifies and revises the knowledge documents and verifies and accepts the resulting state.</desc>
  <defs>
    <marker id="flowhead" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0.6 L9.6,5 L0,9.4 Z" fill="#111111"/>
    </marker>
    <marker id="supporthead" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0.6,1.2 L9.2,5 L0.6,8.8 Z" fill="#ffffff" stroke="#666666" stroke-width="1.2"/>
    </marker>
    <style>
      text { font-family: Inter, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #111111; }
      .n { font-size: 16px; font-weight: 600; }
      .s { font-size: 13px; }
      .m { font-size: 13px; font-weight: 600; }
      .e { font-size: 11px; fill: #666666; }
      .box { fill: #ffffff; stroke: #111111; stroke-width: 1.5; }
      .panel { fill: #f2f2f2; stroke: #111111; stroke-width: 1.5; }
      .flow { fill: none; stroke: #111111; stroke-width: 1.5; stroke-linejoin: round; marker-end: url(#flowhead); }
      .support { fill: none; stroke: #666666; stroke-width: 1.5; stroke-linejoin: round; stroke-dasharray: 6 4; marker-end: url(#supporthead); }
      .plain { fill: none; stroke: #111111; stroke-width: 1.5; stroke-linejoin: round; }
      .rule { stroke: #d9d9d9; stroke-width: 1.5; }
      .disc { fill: #111111; }
    </style>
  </defs>

  <rect x="0" y="0" width="960" height="600" fill="#ffffff"/>

  <!-- Critical Expert -->
  <circle cx="556" cy="84" r="11" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
  <circle cx="556" cy="84" r="5" class="disc"/>
  <text class="n" x="576" y="90">Critical Expert</text>
  <path class="flow" d="M540,98 L472,244"/>
  <path class="flow" d="M706,96 L826,192"/>
  <text class="e" x="498" y="178" text-anchor="end">specifies and revises</text>
  <text class="e" x="790" y="140">verifies and accepts</text>

  <!-- Forms of work -->
  <rect class="box" x="24" y="250" width="152" height="94" rx="2"/>
  <text class="n" x="100" y="282" text-anchor="middle">Preparation</text>
  <text class="s" x="100" y="304" text-anchor="middle">data, sources,</text>
  <text class="s" x="100" y="322" text-anchor="middle">standards, context</text>

  <rect class="box" x="204" y="250" width="152" height="94" rx="2"/>
  <text class="n" x="280" y="282" text-anchor="middle">Exploration</text>
  <text class="s" x="280" y="304" text-anchor="middle">what the data</text>
  <text class="s" x="280" y="322" text-anchor="middle">can support</text>

  <rect class="box" x="384" y="250" width="152" height="94" rx="2"/>
  <text class="n" x="460" y="282" text-anchor="middle">Distillation</text>
  <text class="s" x="460" y="304" text-anchor="middle">Promptotyping</text>
  <text class="s" x="460" y="322" text-anchor="middle">Documents</text>

  <rect class="box" x="564" y="250" width="152" height="94" rx="2"/>
  <text class="n" x="640" y="282" text-anchor="middle">Implementation</text>
  <text class="s" x="640" y="304" text-anchor="middle">agentic work in</text>
  <text class="s" x="640" y="322" text-anchor="middle">an AI harness</text>

  <!-- Promptotype -->
  <rect class="panel" x="744" y="198" width="190" height="146" rx="2"/>
  <text class="n" x="839" y="228" text-anchor="middle">Promptotype</text>
  <text class="s" x="764" y="260">project knowledge</text>
  <text class="s" x="764" y="282">research artefact</text>
  <text class="s" x="764" y="304">referenced data state</text>
  <text class="s" x="764" y="326">grounds of acceptance</text>

  <!-- Flow of work -->
  <path class="flow" d="M180,297 H202"/>
  <path class="flow" d="M360,297 H382"/>
  <path class="flow" d="M540,297 H562"/>
  <path class="flow" d="M720,297 H742"/>

  <!-- Write-back -->
  <path class="support" d="M600,344 V402 H460 V348"/>
  <path class="support" d="M640,344 V444 H280 V348"/>
  <path class="support" d="M680,344 V486 H100 V348"/>
  <text class="e" x="530" y="395" text-anchor="middle">specification revised</text>
  <text class="e" x="530" y="414" text-anchor="middle">most frequent return</text>
  <text class="e" x="460" y="437" text-anchor="middle">data understanding revised</text>
  <text class="e" x="390" y="479" text-anchor="middle">sources or conditions revised</text>
  <text class="n" x="390" y="516" text-anchor="middle">write-back</text>

  <!-- Legend -->
  <path class="flow" d="M700,464 H738"/>
  <text class="e" x="750" y="468">flow of work</text>
  <path class="support" d="M700,490 H738"/>
  <text class="e" x="750" y="494">write-back</text>
  <circle cx="712" cy="516" r="9" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
  <circle cx="712" cy="516" r="4" class="disc"/>
  <text class="e" x="750" y="520">accountable human authority</text>
</svg>

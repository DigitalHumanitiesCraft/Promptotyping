<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="t d">
  <title id="t">Prospective Promptotyping during modelling and data capture in M3GIM</title>
  <desc id="d">A closed clockwise circuit of six stations. The data model structures early data capture, capture populates the generated interface, interaction with the interface reveals requirements, the resulting insights are documented in the decision register and journal, the documented revision yields a revised data model and capture practice, and the revised model begins the next iteration.</desc>
  <defs>
    <marker id="flowhead" viewBox="0 0 12 12" refX="11.5" refY="6" markerWidth="12" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0.5,0.8 L11.5,6 L0.5,11.2 Z" fill="#111111"/>
    </marker>
    <marker id="supporthead" viewBox="0 0 12 12" refX="11.5" refY="6" markerWidth="12" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1.2,1.8 L11.0,6 L1.2,10.2 Z" fill="#ffffff" stroke="#666666" stroke-width="1.2"/>
    </marker>
    <style>
      text { font-family: Inter, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #111111; }
      .n { font-size: 17px; font-weight: 600; }
      .s { font-size: 13px; }
      .m { font-size: 13px; font-weight: 600; }
      .e { font-size: 12px; fill: #666666; }
      .box { fill: #ffffff; stroke: #111111; stroke-width: 2.5; }
      .sub { fill: #ffffff; stroke: #111111; stroke-width: 1.25; }
      .flow { fill: none; stroke: #111111; stroke-width: 2.5; stroke-linejoin: round; marker-end: url(#flowhead); }
      .plain { fill: none; stroke: #111111; stroke-width: 2.5; stroke-linejoin: round; }
      .support { fill: none; stroke: #666666; stroke-width: 1.25; stroke-linejoin: round; stroke-dasharray: 6 4; marker-end: url(#supporthead); }
      .disc { fill: #111111; }
    </style>
  </defs>

  <rect x="0" y="0" width="960" height="520" fill="#ffffff"/>

  <!-- Upper row -->
  <rect class="box" x="50" y="76" width="220" height="92" rx="2"/>
  <text class="n" x="160" y="112" text-anchor="middle">Data model</text>
  <text class="s" x="160" y="136" text-anchor="middle">RiC-O and JSON-LD</text>

  <rect class="box" x="370" y="76" width="220" height="92" rx="2"/>
  <text class="n" x="480" y="112" text-anchor="middle">Early data capture</text>
  <text class="s" x="480" y="136" text-anchor="middle">by project partners</text>

  <rect class="box" x="690" y="76" width="220" height="92" rx="2"/>
  <text class="n" x="800" y="112" text-anchor="middle">Generated interface</text>
  <text class="s" x="800" y="136" text-anchor="middle">exploration and capture</text>

  <!-- Lower row -->
  <rect class="box" x="50" y="316" width="220" height="92" rx="2"/>
  <text class="n" x="160" y="354" text-anchor="middle">Revised data model</text>
  <text class="n" x="160" y="376" text-anchor="middle">and capture</text>

  <rect class="box" x="370" y="316" width="220" height="92" rx="2"/>
  <text class="n" x="480" y="354" text-anchor="middle">Decision register</text>
  <text class="n" x="480" y="376" text-anchor="middle">and journal</text>

  <rect class="box" x="690" y="316" width="220" height="92" rx="2"/>
  <text class="n" x="800" y="354" text-anchor="middle">Modelling and</text>
  <text class="n" x="800" y="376" text-anchor="middle">capture insights</text>

  <!-- Circuit -->
  <path class="flow" d="M274,122 H370"/>
  <text class="e" x="320" y="100" text-anchor="middle">structures the</text>
  <text class="e" x="320" y="114" text-anchor="middle">capture</text>

  <path class="flow" d="M594,122 H690"/>
  <text class="e" x="640" y="100" text-anchor="middle">populates the</text>
  <text class="e" x="640" y="114" text-anchor="middle">interface</text>

  <path class="flow" d="M800,172 V312"/>
  <text class="e" x="814" y="236">interaction reveals</text>
  <text class="e" x="814" y="252">requirements</text>

  <path class="support" d="M690,362 H594"/>
  <text class="e" x="640" y="340" text-anchor="middle">findings are</text>
  <text class="e" x="640" y="354" text-anchor="middle">documented</text>

  <path class="support" d="M370,362 H274"/>
  <text class="e" x="320" y="340" text-anchor="middle">documented</text>
  <text class="e" x="320" y="354" text-anchor="middle">revision</text>

  <path class="flow" d="M160,312 V172"/>
  <text class="e" x="146" y="236" text-anchor="end">revised model</text>
  <text class="e" x="146" y="252" text-anchor="end">next iteration</text>

  <!-- Legend -->
  <path class="flow" d="M50,448 H96"/>
  <text class="e" x="108" y="452">operational flow</text>
  <path class="support" d="M50,476 H96"/>
  <text class="e" x="108" y="480">documented write-back</text>
</svg>

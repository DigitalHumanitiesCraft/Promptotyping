    .eng { font-size: 20px; font-style: italic; }
    .start { text-anchor: start; }
    .line { fill: none; stroke: #1e2749; stroke-width: 1.8; }
    .shape { fill: #ffffff; stroke: #1e2749; stroke-width: 1.8; }
    .thin { fill: none; stroke: #1e2749; stroke-width: 1.3; }
    .fill-surface { fill: #ffffff; }
    .person { fill: none; stroke: #1e2749; stroke-width: 1.8; stroke-linecap: round; }

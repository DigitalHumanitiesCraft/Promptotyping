<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -14 1600 820" width="1600" height="820" role="img" aria-labelledby="pa-t pa-d">
  <title id="pa-t">The Promptotyping working practice</title>
  <desc id="pa-d">Research data and their contexts enter four recurrent forms of work, Preparation, Exploration, Distillation and Implementation, which frontier LLM agents carry out in no fixed order and which researchers and research software developers direct. Each iteration yields a Promptotype, a prototype taken together with the project knowledge base and the research data, and each state is versioned. Verification and agentic review accompany each iteration. The project knowledge base supplies the context for each task, and what checking and use reveal returns to it through knowledge curation. The researchers assess the Promptotype through scholarly validation. Agentic Engineering is the organisation of the agents' work in the four forms, Context Engineering the selection of context for each task, and Knowledge Engineering the project knowledge base and its curation.</desc>

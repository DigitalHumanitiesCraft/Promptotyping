  <text class="sub" x="730" y="591" style="font-size:17px">each task</text>
  <text class="sub" x="730" y="678" style="font-size:17px">maintains</text>
  <text class="head" x="1221" y="190">PROMPTOTYPE</text>
  <text class="sub" x="1220" y="214" style="font-size:17px">the state of an artefact with its project knowledge and research data</text>
  <text class="head" x="1221" y="262" style="font-size:17px;letter-spacing:2.500px">ARTEFACT</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -14 1672 860" width="1672" height="860" role="img" aria-labelledby="pf-t pf-d">
  <title id="pf-t">The Promptotyping working practice</title>
  <desc id="pf-d">Researchers and research software developers direct four recurrent forms of work that frontier LLM agents carry out, Preparation, Exploration, Distillation and Implementation, which follow no fixed order. The researchers assess each Promptotype through scholarly validation. A Promptotype is a prototype taken together with the project knowledge base and the research data from which it was built, and earlier states remain as versions. Distillation maintains the knowledge base, which supplies the context for each task, and the research data are the basis of building. Verification and agentic review accompany each iteration, and what checking and use reveal returns to the knowledge base through knowledge curation. Knowledge Engineering is the project knowledge base and its curation, Context Engineering the selection of context for each task, and Agentic Engineering the organisation of the agents' work in the four forms. The files shown are examples.</desc>

      <rect x="1234" y="284" width="34" height="11" rx="5.500"/><rect x="1234" y="302" width="50" height="11" rx="5.500"/><rect x="1234" y="320" width="26" height="11" rx="5.500"/><rect x="1234" y="338" width="44" height="11" rx="5.500"/><rect x="1234" y="356" width="32" height="11" rx="5.500"/><rect x="1234" y="374" width="48" height="11" rx="5.500"/>

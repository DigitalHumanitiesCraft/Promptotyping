  <text class="mono" x="357" y="596">data.md</text>
  <text class="mono" x="496" y="596">specification.md</text>
  <text class="mono" x="646" y="596">design.md</text>
  <text class="mono" x="790" y="596">journal.md</text>
  <text class="mono" x="900" y="596">plan.md</text>
  <text class="mono" x="1075" y="596">CLAUDE.md</text>

  <text class="sub end" x="1274" y="696">each state versioned</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 720" width="1300" height="720" role="img" aria-labelledby="pb-t pb-d">
  <title id="pb-t">A Promptotype opened, with CorrespExplorer as the example</title>
  <desc id="pb-d">A Promptotype is a prototype taken together with the project knowledge base and the research data from which it was built. The example is CorrespExplorer. Its prototype offers coordinated views, among them map, timeline, network and topics. Its research data are correspondence metadata in CMIF-XML and are the basis of building. Its project knowledge base holds declarative documents, project.md, data.md, specification.md and design.md, process documents, journal.md and plan.md, and the agent instructions in CLAUDE.md, and it describes the research data. The files shown are a selection. Each state of the Promptotype is versioned.</desc>
  <style>
    svg { color: #1e2749; background: #ffffff; }
    text { fill: #1e2749; font-family: Arial, Helvetica, sans-serif; text-anchor: middle; }
    .head { font-size: 20px; font-weight: 700; letter-spacing: 2.5px; }
    .title { font-size: 22px; }
    .sub { font-size: 20px; }
    .mono { font-family: Consolas, Menlo, "DejaVu Sans Mono", "Courier New", monospace; font-size: 18px; }
    .start { text-anchor: start; }
    .end { text-anchor: end; }
    .line { fill: none; stroke: #1e2749; stroke-width: 1.8; }
    .shape { fill: #ffffff; stroke: #1e2749; stroke-width: 1.8; }
    .thin { fill: none; stroke: #1e2749; stroke-width: 1.3; }
    .fill-surface { fill: #ffffff; }
    .cat-proto { stroke: #b8701a; }
    .cat-base { stroke: #4a7ab8; fill: #edf2f8; }
    .kb-frame { fill: none; stroke: #4a7ab8; stroke-width: 1.3; stroke-dasharray: 7 6; }
  </style>
  <rect x="0" y="0" width="1300" height="720" fill="#ffffff"/>
  <defs>
    <marker id="pb-arrow" viewBox="0 0 18 16" refX="17" refY="8" markerWidth="18" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M1,1 L17,8 L1,15 Z" class="fill-surface" stroke="currentColor" stroke-width="1.6" stroke-linejoin="miter"/>
    </marker>
    <g id="pb-map">
      <path d="M22,4 C30,-2 40,6 48,2 C58,-2 62,10 70,12 C80,14 84,26 78,36 C86,46 76,58 66,58 C58,70 44,62 36,68 C26,74 14,66 14,54 C2,50 0,36 8,28 C4,16 12,6 22,4 Z" fill="none"/>
    </g>
    <g id="pb-sheet">
      <path d="M0,0 H70 L94,24 V130 H0 Z" class="fill-surface"/>
      <path d="M70,0 V24 H94" fill="none"/>
    </g>
  </defs>

  <rect x="44" y="44" width="1230" height="620" rx="14" class="shape cat-proto"/>
  <rect x="32" y="32" width="1230" height="620" rx="14" class="shape cat-proto"/>
  <rect x="20" y="20" width="1230" height="620" rx="14" class="shape cat-proto"/>

  <text class="head title" x="635" y="60">PROMPTOTYPE</text>
  <text class="sub" x="635" y="90">example: CorrespExplorer</text>

  <text class="head" x="400" y="146">PROTOTYPE</text>

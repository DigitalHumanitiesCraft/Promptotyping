  <text class="sub start" x="974" y="358">describes</text>

  <rect class="kb-frame" x="50" y="402" width="1170" height="216" rx="10"/>
  <text class="head" x="635" y="434">PROJECT KNOWLEDGE BASE</text>
  <text class="sub" x="446" y="476">declarative</text>
  <text class="sub" x="845" y="476">process</text>

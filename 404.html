<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Promptotyping. Specification of the Method</title>
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://dhcraft.org/Promptotyping/">

  <script>
    // Apply the stored theme before first paint, so a dark reader never sees
    // a white flash.
    (function () {
      try {
        var t = localStorage.getItem("promptotyping-theme");
        if (t) { document.documentElement.setAttribute("data-theme", t); }
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="assets/css/style.css">

  <script>
    // Subpath-to-hash routing. GitHub Pages serves 404.html for any path that
    // is not a real file. This file maps the requested subpath onto the
    // canonical hash anchor and hands over to index.html, so the shell exists
    // exactly once and cannot drift. Mirrors resolveTemplateUrl in app.js.
    (function () {
      // Preserve a snapshot suffix (e.g. v0.1) so
      // /promptotyping-document/data#v0.1 stays addressable.
      var incomingHash = window.location.hash.replace(/^#/, "");
      var path = window.location.pathname
        .replace(/^\/Promptotyping\//, "")
        .replace(/^\//, "")
        .replace(/\/$/, "");
      var segments = path.split("/");

      // Paths that are a page of their own, addressed by their bare slug.
      var PAGE_PATHS = {
        ueberblick: "ueberblick",
        anwendung: "anwendung",
        workflow: "workflow",
        artefakt: "artefakt",
        verifikation: "verifikation",
        vorlagen: "vorlagen",
        konvention: "konvention-v0.1",
        "use-cases": "use-cases",
        praxis: "praxis",
        skills: "skills",
        arbeitsumgebung: "arbeitsumgebung",
        glossar: "glossar",
        vault: "vault",
        paper: "paper",
        literatur: "literatur"
      };

      // Prefixed families: the first segment names the family, the second the
      // item.
      var PREFIXES = {
        "promptotyping-document": "promptotyping-document-",
        konzepte: "konzept-",
        "case-studies": "case-",
        konvention: "konvention-",
        paper: "abschnitt-",
        praxis: "praxis-",
        skills: "skills-",
        vault: "vault-"
      };

      var anchor = null;
      if (PREFIXES[segments[0]] && segments[1]) {
        anchor = PREFIXES[segments[0]] + segments[1];
        if (segments[0] === "promptotyping-document" && /^v[\d.]+$/.test(incomingHash)) {
          anchor += "-" + incomingHash;
        }
      } else if (PAGE_PATHS[segments[0]] && !segments[1]) {
        anchor = PAGE_PATHS[segments[0]];
      }

      if (anchor) {
        // replace() rather than assign(), so the unresolved subpath leaves no
        // history entry to return to.
        window.location.replace("/Promptotyping/#" + anchor);
      }
    })();
  </script>
</head>

  <main class="not-found-body">
    <h1>Page not found</h1>
    <p>This address does not exist. Back to the <a href="/Promptotyping/">start page</a>.</p>
  </main>

</body>
</html>

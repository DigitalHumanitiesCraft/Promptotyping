<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found. Promptotyping</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/Promptotyping/assets/img/dhcraft-logo-watercolor.png" type="image/png">
  <link rel="stylesheet" href="/Promptotyping/assets/dhcraft/dhcraft-tokens.css">
  <link rel="stylesheet" href="/Promptotyping/assets/dhcraft/dhcraft-components.css">
  <link rel="stylesheet" href="/Promptotyping/assets/css/site.css">
  <script>
    // Until 14 November 2026 the templates lay under _content/promptotyping-document/.
    // A reader who follows an old address to a template that still exists lands on it.
    (function () {
      var kept = ["action-layer", "architecture", "data", "design", "domain-knowledge", "index",
        "journal", "plan", "project", "specification", "testing"];
      var m = window.location.pathname.match(/_content\/promptotyping-document\/([a-z-]+)\.md$/);
      if (m && kept.indexOf(m[1]) !== -1) {
        window.location.replace("/Promptotyping/templates/" + m[1] + ".md");
      } else if (/_content\/konvention\.md$/.test(window.location.pathname)) {
        window.location.replace("/Promptotyping/templates/convention.md");
      }
    })();
  </script>
</head>
<body>
  <main class="dh-page">
    <h1>Page not found</h1>
    <p>This address does not exist. Since November 2026 the site is one page, and the templates lie under <code>templates/</code>. Back to the <a href="/Promptotyping/">start page</a>.</p>
  </main>
</body>
</html>
